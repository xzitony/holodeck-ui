## Dev compose file — pulls the floating :dev image (rebuilt on every push to the dev branch)
## No Caddy/TLS here — published directly over HTTP on a non-3000 port so it can run
## side-by-side with a prod stack on the same host without colliding.
##
## Usage:
##   1. Paste this into Portainer Stacks
##   2. Set environment variables below
##   3. Deploy
##   4. Visit http://<host>:${APP_PORT:-3001}
##   5. To pick up a new push to dev: re-pull and redeploy the stack (Portainer: "Pull and redeploy")
##
## Required env vars:
##   JWT_SECRET=<random-secret>
## Optional env vars:
##   APP_PORT=<host port to publish on, default 3001>

services:
  app:
    image: ghcr.io/xzitony/holodeck-ui:dev
    restart: unless-stopped
    volumes:
      - app_data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/holodeck.db
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-VCF 9 Holodeck Router (dev)}
    ports:
      - "${APP_PORT:-3001}:3000"

volumes:
  app_data:
